name: JorsenShop V2 validation (no deployment)
on:
  push:
    branches:
      - feature/jorsenshop-v2-foundations
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          set -e
          for file in api/v2/*.js api/v2/_lib/*.js api/v2/admin/*.js v2/*.mjs site/v2-*.js scripts/build-approved-v11-from-git.mjs; do
            node --check "$file"
          done
      - name: Shipping policy tests
        run: node --test v2/shipping-policy.test.mjs
      - name: Restore approved V1.1 and augment V2 (no publish)
        run: |
          node scripts/build-approved-v11-from-git.mjs
          node --check site/app.js
          test -s site/s/a7m4/index.html
          test -s site/s/i9p2/index.html
          test -s site/s/l6q8/index.html
          grep -q 'v2-client.js' site/index.html
          grep -q 'v2-staff.js' site/s/l6q8/index.html
      - name: Assert protected original assets
        run: |
          test -s site/assets/favicon.svg
          test -s site/styles.css
          test -s site/mobile-first.css
          test -s site/catalogue.js
